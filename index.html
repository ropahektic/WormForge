<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WormForge — weapon editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    (() => {
      const t = localStorage.getItem("wf-theme");
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    })();
  </script>
  <style>
    :root {
      --wash-top: #9eb8cc;
      --sky: #c9dff0;
      --dirt: #e8e0d0;
      --panel: #f7f3ea;
      --ink: #1a2218;
      --muted: #5a6554;
      --line: #8a9a7a;
      --accent: #2f6b3a;
      --accent-ink: #f7f3ea;
      --pick: #dce8d4;
      --input: #fffdf8;
      --stage-a: #cfc6b4;
      --stage-b: #e8e0d0;
      --cat-line: #d5cdb8;
      --err: #a83228;
      --radius: 2px;
    }
    html[data-theme="dark"] {
      --wash-top: #2a3540;
      --sky: #1a222a;
      --dirt: #14181a;
      --panel: #1c211c;
      --ink: #e8e4d8;
      --muted: #9aa392;
      --line: #3d4a3c;
      --accent: #4a9a58;
      --accent-ink: #0e140f;
      --pick: #273028;
      --input: #121612;
      --stage-a: #2a3028;
      --stage-b: #1a1e18;
      --cat-line: #2a3028;
      --err: #ff8d7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 500 14px/1.4 "Chakra Petch", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, var(--wash-top) 0%, var(--sky) 18%, var(--dirt) 42%, var(--dirt) 100%);
      min-height: 100vh;
    }
    .app { max-width: 1280px; margin: 0 auto; padding: 22px 16px 56px; }
    .brand {
      margin: 0 0 8px;
    }
    .logo {
      display: block;
      width: min(420px, 100%);
      height: auto;
    }
    h1 {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
    p.lead {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 14px;
      max-width: 52rem;
    }
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0 4px;
      align-items: center;
      margin: 0 0 18px;
      font-size: 14px;
    }
    .bar a {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 600;
    }
    .bar a:hover { color: var(--accent); }
    .bar .sep {
      color: var(--muted);
      margin: 0 8px;
      user-select: none;
    }
    .bar .grow { flex: 1; min-width: 12px; }
    .theme {
      display: inline-flex;
      gap: 2px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }
    .theme button {
      margin: 0;
      padding: 4px 10px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      border-radius: var(--radius);
    }
    .theme button.active {
      background: var(--accent);
      color: var(--accent-ink);
    }
    button.ghost {
      display: inline-block;
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 7px 12px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }
    .work {
      display: grid;
      grid-template-columns: 200px 1fr 320px;
      grid-template-rows: auto 1fr;
      gap: 12px;
      align-items: start;
    }
    .work > .tree { grid-column: 1; grid-row: 1; }
    .work > .editor { grid-column: 2; grid-row: 1; }
    .work > .lua { grid-column: 2; grid-row: 2; margin-top: 0; }
    .work > .sprites {
      grid-column: 3;
      grid-row: 1 / span 2;
      align-self: stretch;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    label.field {
      display: block;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 10px 0 4px;
    }
    input, select {
      width: 100%;
      background: var(--input);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 6px 8px;
      font: inherit;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .meta {
      margin: 6px 0 0;
      font: 500 12px/1.35 "IBM Plex Mono", monospace;
      color: var(--muted);
    }
    .err { color: var(--err); min-height: 1.2em; margin: 8px 0 0; }
    button.primary {
      margin-top: 12px;
      background: var(--accent);
      color: var(--accent-ink);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 9px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .tree-btn, .tab, .fire, .check, .catalog button, .cat-mode button {
      cursor: pointer;
      font: inherit;
    }
    .tree h2, .sprites h2, .editor h2, .lua h2 {
      margin: 0 0 8px;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .tree-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--ink);
      border: 0;
      border-radius: var(--radius);
      padding: 6px 7px;
      margin: 0 0 2px;
    }
    .tree-btn.child { padding-left: 16px; }
    .tree-btn.grand { padding-left: 28px; }
    .tree-btn.active { background: var(--accent); color: var(--accent-ink); }
    .tree-btn .meta { color: inherit; opacity: .75; margin: 2px 0 0; }
    .tabs { display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 10px; border: 1px solid var(--line); }
    .tab {
      background: transparent;
      color: var(--ink);
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
    }
    .tab:last-child { border-right: 0; }
    .tab.active { background: var(--accent); color: var(--accent-ink); }
    .fires { display: flex; flex-wrap: wrap; gap: 6px; }
    .fire {
      background: var(--input);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 6px 10px;
      font-weight: 600;
    }
    .fire.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .mods { display: grid; gap: 6px; margin-top: 10px; }
    .check {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 2px 0;
    }
    .check input { width: auto; margin: 0; }
    .check b { font-weight: 600; }
    .pick-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 8px 0 0;
      font-size: 13px;
    }
    .pick-row b { font-family: "IBM Plex Mono", monospace; font-weight: 500; }
    .path-box {
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: var(--input);
    }
    .path-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: baseline;
      font-size: 13px;
      margin: 0 0 4px;
    }
    .path-row span { color: var(--muted); min-width: 72px; }
    .path-row b { font-family: "IBM Plex Mono", monospace; font-weight: 500; }
    .path-row em { font-style: normal; color: var(--accent); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .check .hint { color: var(--muted); font-size: 12px; font-weight: 500; }
    .count { float: right; color: var(--muted); font-size: 12px; font-weight: 500; }
    .cat-mode { display: flex; gap: 0; margin: 8px 0; border: 1px solid var(--line); }
    .cat-mode button {
      flex: 1;
      background: transparent;
      color: var(--ink);
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      padding: 6px 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .cat-mode button:last-child { border-right: 0; }
    .cat-mode button.active { background: var(--accent); color: var(--accent-ink); }
    .px-more {
      display: none;
      width: 100%;
      margin: 8px 0 0;
      padding: 6px 10px;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .px-more:not([hidden]) { display: block; }
    .px-more:hover { color: var(--accent); border-color: var(--accent); }
    .aim-mode { display: flex; gap: 0; margin: 0 0 10px; border: 1px solid var(--line); }
    .aim-mode button {
      flex: 1;
      background: transparent;
      color: var(--ink);
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      padding: 6px 4px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .aim-mode button:last-child { border-right: 0; }
    .aim-mode button.active { background: var(--accent); color: var(--accent-ink); }
    .aim-generate-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 0;
      flex-wrap: wrap;
    }
    button.aim-generate {
      background: #c62828;
      color: #fff;
      border: 1px solid #8e0000;
      border-radius: var(--radius);
      padding: 7px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button.aim-generate:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    html[data-theme="dark"] button.aim-generate {
      background: #e53935;
      border-color: #ff8a80;
      color: #fff;
    }
    .aim-generate-hint {
      color: #c9a000;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.02em;
    }
    html[data-theme="dark"] .aim-generate-hint {
      color: #ffe082;
    }
    .aim-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
      padding: 12px;
      background: var(--input);
      border: 1px solid var(--line);
      image-rendering: pixelated;
    }
    .aim-preview canvas { width: 120px; height: 120px; image-rendering: pixelated; }
    .aim-sliders { display: grid; gap: 8px; margin: 8px 0; }
    .aim-sliders label { display: grid; grid-template-columns: 72px 1fr 40px; gap: 8px; align-items: center; font-size: 12px; }
    .aim-sliders input[type="range"] { width: 100%; }
    .catalog {
      position: relative;
      height: 360px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--input);
    }
    .cat-spacer { position: relative; }
    .catalog > .cat-spacer > button {
      position: absolute;
      left: 0;
      right: 0;
      display: grid;
      grid-template-columns: 40px 1fr auto;
      align-items: center;
      gap: 8px;
      margin: 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--cat-line);
      padding: 4px 8px;
    }
    .catalog button:hover { background: var(--pick); }
    .catalog button.selected { background: var(--accent); color: var(--accent-ink); }
    .thumb {
      display: block;
      overflow: hidden;
      flex-shrink: 0;
      background:
        linear-gradient(45deg, var(--stage-a) 25%, transparent 25%) 0 0 / 8px 8px,
        linear-gradient(45deg, var(--stage-b) 25%, var(--stage-a) 0) 4px 4px / 8px 8px;
    }
    .thumb img, .stage-clip img {
      display: block;
      image-rendering: pixelated;
      max-width: none;
      width: auto;
      height: auto;
    }
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 4px;
      padding: 6px;
    }
    .icon-grid button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin: 0;
      background: transparent;
      color: var(--ink);
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 6px 4px;
      font-size: 11px;
    }
    .icon-grid button.selected { border-color: var(--accent); background: var(--pick); color: var(--accent); }
    .icon-grid img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 160px;
      margin: 8px 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(45deg, var(--stage-a) 25%, transparent 25%) 0 0 / 16px 16px,
        linear-gradient(45deg, var(--stage-b) 25%, var(--stage-a) 0) 8px 8px / 16px 16px;
      overflow: hidden;
    }
    .stage-clip {
      overflow: hidden;
      flex-shrink: 0;
    }
    .catalog img, .stage img, .icon-grid img {
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
    }
    .selected-name {
      margin: 6px 0 0;
      font: 500 12px/1.35 "IBM Plex Mono", monospace;
    }
    .lua { margin-top: 0; }
    pre {
      margin: 0;
      white-space: pre-wrap;
      font: 12px/1.45 "IBM Plex Mono", monospace;
      color: var(--ink);
      background: var(--input);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      max-height: 420px;
      overflow: auto;
    }
    @media (max-width: 980px) {
      .work {
        grid-template-columns: 1fr;
        grid-template-rows: none;
      }
      .work > .tree,
      .work > .editor,
      .work > .lua,
      .work > .sprites {
        grid-column: auto;
        grid-row: auto;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="brand">
      <h1>WormForge</h1>
      <img class="logo" src="https://i.imgur.com/6Yfe1p6.png" alt="WormForge — a modding API for Worms Armageddon" />
    </div>
    <p class="lead">DLL next to WA.exe · WormKit · examples in Mods/</p>
    <div class="bar">
      <a href="https://github.com/ropahektic/WormForge/releases/latest">wkLua.zip</a>
      <span class="sep">·</span>
      <a href="downloads/mods.zip">Example Mods</a>
      <span class="sep">·</span>
      <a href="https://github.com/ropahektic/WormForge">GitHub</a>
      <span class="grow"></span>
      <div class="theme" id="theme">
        <button type="button" data-theme="light" class="active">☼</button>
        <button type="button" data-theme="dark">☾</button>
      </div>
    </div>

    <div class="work">
      <nav class="panel tree">
        <h2>Tree</h2>
        <div id="tree"></div>
      </nav>

      <section class="panel editor">
        <div class="tabs" id="tabs"></div>
        <div id="panel"></div>
        <p class="err" id="error"></p>
        <button class="primary" id="download" type="button">Download Mods pack</button>
      </section>

      <aside class="panel sprites">
        <h2>Sprite <span class="count" id="sprite-count"></span></h2>
        <div class="cat-mode">
          <button type="button" id="mode-stock" class="active" data-catmode="stock">Stock</button>
          <button type="button" id="mode-px" data-catmode="px">PX</button>
          <button type="button" id="mode-icon" data-catmode="icon">Icon</button>
        </div>
        <button type="button" class="ghost" id="add-gifs" style="margin:8px 0 0;width:100%">Add GIF/PNG</button>
        <input id="gif-files" type="file" accept=".gif,.png,image/gif,image/png" multiple hidden />
        <input id="filter" placeholder="filter…" style="margin-top:8px" />
        <p class="selected-name" id="picked">none</p>
        <div class="stage"><div class="stage-clip" id="stage-clip"><img id="sprite-img" alt="" /></div></div>
        <div class="catalog" id="catalog"></div>
        <button type="button" class="px-more" id="px-more" hidden>Show All</button>
      </aside>

      <section class="panel lua">
        <h2>weapons.lua</h2>
        <pre id="preview"></pre>
      </section>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.js"></script>
  <script src="aim_bake.js?v=web35"></script>
  <script src="app.js?v=web35"></script>
  <script>
    (() => {
      const root = document.documentElement;
      const box = document.getElementById("theme");
      const sync = (theme) => {
        root.setAttribute("data-theme", theme);
        localStorage.setItem("wf-theme", theme);
        box.querySelectorAll("button").forEach((b) => {
          b.classList.toggle("active", b.dataset.theme === theme);
        });
      };
      sync(root.getAttribute("data-theme") === "dark" ? "dark" : "light");
      box.addEventListener("click", (ev) => {
        const btn = ev.target.closest("button[data-theme]");
        if (!btn) return;
        sync(btn.dataset.theme);
      });
    })();
  </script>
</body>
</html>
